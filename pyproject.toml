[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "perp-md"
version = "0.2.6"
description = "Typed asynchronous perpetual-market open-interest and funding acquisition"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{name = "perp-md contributors"}]
keywords = ["market-data", "open-interest", "funding-rate", "perpetuals", "asyncio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "crypto-derivative-markets==0.1.0",
  "httpx>=0.27,<1",
]

[project.scripts]
perp-md-coverage = "perp_md.capabilities:main"

[project.optional-dependencies]
ccxt = ["ccxt>=4.5,<5"]
dev = [
  "build>=1,<2",
  "ccxt>=4.5,<5",
  "jsonschema>=4.23,<5",
  "pytest>=8,<10",
  "twine>=6,<7",
]

[project.urls]
Homepage = "https://github.com/latheiere/perp-md"
Documentation = "https://github.com/latheiere/perp-md/tree/main/docs"
Repository = "https://github.com/latheiere/perp-md"
Changelog = "https://github.com/latheiere/perp-md/blob/main/CHANGELOG.md"
Issues = "https://github.com/latheiere/perp-md/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
perp_md = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
